openapi: 3.1.0
info:
  title: 『정토대전 (淨土大典)』 100% 전자책 · 가상계좌 · 금강(金剛) DRM API 명세서
  version: 1.0.0
  description: |
    종이책 미발행(100% 전자책 단독 발행 · E-ISBN 부가가치세 0% 면세), PG 1회용 가상계좌(무통장 송금) 단일 결제(+72h TTL),
    웹훅 3중 멱등성(HMAC-SHA256 + Redis SETNX + DB UNIQUE), 전자상거래법 제17조 제2항 제5호 열람 개시(ReadingStart) 환불 잠금,
    그리고 금강(金剛) DRM(CloudFront OAC 300초 서명 URL + HTTP 206 64KB Range 스트리밍 + 기기 3대 슬롯 제어)을 위한 프로덕션 API 계약서입니다.
servers:
  - url: https://ebook-api.jungto.org
    description: Production API Gateway
  - url: http://localhost:8123
    description: Local Production PoC Server

paths:
  /api/v1/orders/vbank:
    post:
      summary: 100% 전자책 주문 생성 및 1회용 가상계좌(+72h) 채번
      operationId: createVbankOrder
      tags: [Orders & VirtualAccount]
      description: |
        실물 배송지 주소를 일체 수집하지 않으며, 6대 은행 중 선택된 은행으로 200,000원(E-ISBN 면세 0%) 전용 1회용 가상계좌를 채번합니다.
        미열람 청약철회(7일 이내) 시 자동 송금을 위해 환불 반환 계좌를 함께 수집하여 AES-256-GCM으로 암호화 저장합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vbankBankCode
                - refundBankCode
                - refundAccountNo
                - refundHolderName
                - agreedDigitalLaw
                - agreedCopyrightWatermark
                - agreedPrivacyRefundAccount
              properties:
                vbankBankCode:
                  type: string
                  enum: ["004", "088", "020", "081", "011", "003"]
                  description: 입금할 가상계좌 은행코드 (국민/신한/우리/하나/농협/기업)
                refundBankCode:
                  type: string
                  description: 미열람 환불 시 반환받을 은행코드
                refundAccountNo:
                  type: string
                  description: 환불 반환 계좌번호 (서버 수신 즉시 AES-256-GCM 암호화)
                refundHolderName:
                  type: string
                  description: 환불 계좌 예금주 성명
                cashReceiptType:
                  type: string
                  enum: [NONE, INCOME_DEDUCTION, EXPENSE_PROOF]
                  default: INCOME_DEDUCTION
                cashReceiptIdentifier:
                  type: string
                  description: 휴대폰번호 또는 사업자등록번호 (면세 0% 현금영수증 발행용)
                agreedDigitalLaw:
                  type: boolean
                  description: 전자상거래법 제17조 제2항 제5호 (1페이지 이상 열람 개시 시 청약철회 불가 동의)
                agreedCopyrightWatermark:
                  type: boolean
                  description: 금강 DRM 동적/비가시 포렌식 워터마크 각인 동의
                agreedPrivacyRefundAccount:
                  type: boolean
                  description: 환불 반환계좌 수집 및 5년 법정 보관 동의
      responses:
        "201":
          description: 가상계좌 채번 완료 (AWAITING_DEPOSIT)
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string, format: uuid }
                  orderNo: { type: string, example: "JTS-2026-1023-8841" }
                  eIsbn: { type: string, example: "979-11-98765-01-2" }
                  supplyAmount: { type: integer, example: 200000 }
                  vatAmount: { type: integer, example: 0 }
                  totalAmount: { type: integer, example: 200000 }
                  vbankBankName: { type: string, example: "KB국민은행" }
                  vbankAccountNo: { type: string, example: "784201-04-992831" }
                  vbankHolderName: { type: string, example: "재단법인정토회" }
                  vbankExpiresAt: { type: string, format: date-time }
                  status: { type: string, example: "AWAITING_DEPOSIT" }

  /api/v1/webhooks/pg/vbank-deposit:
    post:
      summary: PG 가상계좌 입금 완료 통보 웹훅 (3중 멱등성 파이프라인)
      operationId: handlePgVbankWebhook
      tags: [Orders & VirtualAccount]
      description: |
        1단계: X-PG-Signature HMAC-SHA256 서명 검증 (불일치 시 401 반환)
        2단계: Redis `SETNX lock:webhook:{pg_tx_id} EX 30` 분산 락 + PostgreSQL `UNIQUE(pg_tx_id)` 멱등 검증
        3단계: 단일 ACID 트랜잭션으로 `ebook_orders.status = 'PAID'`, `ebook_entitlements.status = 'ACTIVE'` 생성 및 Outbox 이벤트 발행
      parameters:
        - name: X-PG-Signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256(raw_body, PG_WEBHOOK_SECRET)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pgTxId, orderNo, eventType, depositAmount]
              properties:
                pgTxId: { type: string, example: "PG-TX-20261023-99102" }
                orderNo: { type: string, example: "JTS-2026-1023-8841" }
                eventType: { type: string, enum: [DEPOSIT_COMPLETED, VBANK_EXPIRED] }
                depositAmount: { type: integer, example: 200000 }
                depositedAt: { type: string, format: date-time }
      responses:
        "200":
          description: 정상 처리 완료 또는 이미 처리된 중복 웹훅 (멱등성 보장 응답)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, enum: [PROCESSED, ALREADY_PROCESSED_IDEMPOTENT] }
                  pgTxId: { type: string }
                  entitlementId: { type: string, format: uuid }
        "401":
          description: HMAC-SHA256 서명 불일치 차단

  /api/v1/viewer/session:
    post:
      summary: 금강(金剛) DRM 뷰어 세션 발급 및 기기 3대 슬롯 검증
      operationId: issueViewerSession
      tags: [Geumgang DRM & Viewer]
      description: |
        회원의 유효한 `ACTIVE` 판권과 기기 핑거프린트(`deviceFpHash`)를 대조합니다.
        동시 등록 기기가 3대를 초과한 상태에서 4번째 신규 기기로 접속하면 `403 DEVICE_LIMIT_EXCEEDED`와 함께 기존 등록 기기 목록을 반환합니다.
        통과 시 CloudFront OAC Signed URL(TTL 300초, HTTP 206 64KB Range 스트리밍용)과 포렌식 워터마크 토큰을 발급합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entitlementId, volumeNo, deviceFpHash, deviceName]
              properties:
                entitlementId: { type: string, format: uuid }
                volumeNo: { type: integer, minimum: 1, maximum: 4 }
                deviceFpHash: { type: string, description: "SHA-256(Canvas + WebGL + Audio + UA)" }
                deviceName: { type: string, example: "iPad Air 5 (Safari 17)" }
      responses:
        "200":
          description: 뷰어 세션 및 CloudFront OAC 300초 서명 URL 발급 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  viewerSessionToken: { type: string }
                  signedChunkBaseUrl: { type: string, example: "https://ebook-cdn.jungto.org/releases/v1.0.0/books/vol1_linearized.pdf?Policy=...&Key-Pair-Id=..." }
                  signedUrlTtlSeconds: { type: integer, example: 300 }
                  rangeChunkSizeBytes: { type: integer, example: 65536 }
                  slidingWindowPages: { type: integer, example: 3 }
                  forensicWatermarkHash: { type: string, example: "JTS-WM-8F92A1C4E7B0" }
                  registeredDevicesCount: { type: integer, example: 2 }
                  maxDevicesLimit: { type: integer, example: 3 }
        "403":
          description: 기기 3대 슬롯 초과 (4번째 기기 접속 차단 - 원격 기기 해제 모달 트리거)

  /api/v1/viewer/reading-start:
    post:
      summary: 최초 1페이지 열람 개시(ReadingStart) 단방향 법정 잠금 기록
      operationId: lockReadingStart
      tags: [Geumgang DRM & Viewer]
      description: |
        전자상거래법 제17조 제2항 제5호에 의거하여 회원이 최초 열람 동의 모달을 승인하고 1페이지 렌더링을 시작하는 즉시
        `ebook_entitlements.reading_started_at = COALESCE(reading_started_at, NOW())`를 단방향 영구 기록합니다.
        이 시점 이후부터 온라인 자동 청약철회(환불)는 영구 잠금됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entitlementId, volumeNo, deviceFpHash]
              properties:
                entitlementId: { type: string, format: uuid }
                volumeNo: { type: integer, example: 1 }
                deviceFpHash: { type: string }
      responses:
        "200":
          description: 열람 개시 시각 영구 잠금 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  entitlementId: { type: string, format: uuid }
                  readingStartedAt: { type: string, format: date-time }
                  refundable: { type: boolean, example: false }

  /api/v1/orders/{orderId}/refund:
    post:
      summary: 법정 청약철회(환불) 요청 및 ReadingStart 잠금 검증 게이트
      operationId: requestOrderRefund
      tags: [Orders & VirtualAccount]
      description: |
        결제 완료 후 7일 이내 주문에 대해 `ebook_entitlements.reading_started_at`을 검사합니다.
        - `reading_started_at IS NULL` (미열람): 사전 수집된 환불 반환계좌(AES-256 복호화)로 PG 원화 이체를 실행하고 판권을 `REVOKED`로 회수합니다 (`200 OK`).
        - `reading_started_at IS NOT NULL` (1페이지 이상 열람): 전자상거래법 제17조 제2항 제5호에 따라 온라인 환불을 즉시 차단합니다 (`409 Conflict`).
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 미열람 확인 완료 및 환불 반환계좌 원화 송금 성공 (REFUNDED / REVOKED)
        "409":
          description: 1페이지 이상 열람 이력 존재로 인한 법정 청약철회 제한 (READING_ALREADY_STARTED_LOCKED)
